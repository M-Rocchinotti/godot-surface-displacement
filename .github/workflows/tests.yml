name: Tests

# Every test suite of tests/run_all.py on Linux, with Godot's official 4.7.2 build. The render
# suites need a rendering device: Mesa's lavapipe (software Vulkan) under Xvfb. The benchmark
# (it needs an idle real GPU), the mutation checks (slow) and the Blender bake (no Blender here)
# are not run. The committed native libraries are checked against their sources there
# (bake_tests.gd, library_matches_sources); the native job builds them from source for Linux and
# Windows and runs the bake tests on the fresh Linux build, the windows job runs the headless
# suites with the committed DLL.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.2-stable
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lavapipe, llvmpipe and Xvfb
        run: |
          sudo apt-get update
          # Vulkan (lavapipe) for Forward+ and Mobile, OpenGL (llvmpipe) for Compatibility.
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libgl1-mesa-dri libglx-mesa0 libegl-mesa0 xvfb

      - name: Download Godot
        run: |
          # Outside the checkout: the shipped-archive check packs every untracked file in it.
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Run the tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/run_all.py

      - name: Upload the engine logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: godot-logs
          path: build/logs/

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.2-stable
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install SCons, MinGW, lavapipe and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ g++-mingw-w64-x86-64-posix mesa-vulkan-drivers xvfb
          python -m pip install scons

      - name: Build the GDExtension for Linux and Windows
        run: python tools/build_native.py linux windows

      - name: Download Godot
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Bake tests with the fresh build
        run: |
          python tools/godot.py --headless --import --log native_import
          xvfb-run -a -s "-screen 0 1920x1080x24" python tools/godot.py --script tests/bake_tests.gd --log native_bake_tests

      - name: Upload the libraries
        uses: actions/upload-artifact@v7
        with:
          name: gads-native
          path: addons/gads/native/bin/

      - name: Upload the engine logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: godot-logs-native
          path: build/logs/

  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download Godot
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "godot.zip"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION/Godot_v$($env:GODOT_VERSION)_win64.exe.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "godot")
          "GODOT_BIN=$(Join-Path $env:RUNNER_TEMP "godot\Godot_v$($env:GODOT_VERSION)_win64_console.exe")" >> $env:GITHUB_ENV

      - name: Headless suites with the committed DLL
        run: |
          python tools/godot.py --headless --import --log win_import
          python tools/godot.py --headless --script tests/run_logic_tests.gd --log win_logic_tests
          python tools/godot.py --headless --script tests/bake_tests.gd --log win_bake_tests

      - name: Upload the engine logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: godot-logs-windows
          path: build/logs/
