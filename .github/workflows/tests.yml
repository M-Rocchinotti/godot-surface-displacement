name: Tests

# Every test suite of tests/run_all.py on Linux, with Godot's official 4.7.2 build. The render
# suites need a rendering device: Mesa's lavapipe (software Vulkan) under Xvfb. The benchmark
# (it needs an idle real GPU), the mutation checks (slow) and the Blender bake (no Blender here)
# are not run.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.2-stable
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lavapipe and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb

      - name: Download Godot
        run: |
          # Outside the checkout: the shipped-archive check packs every untracked file in it.
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Run the tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/run_all.py

      - name: Upload the engine logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: godot-logs
          path: build/logs/
